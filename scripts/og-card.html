<!DOCTYPE html>
<!--
  The Open Graph card template. One file, parameterised through the query string,
  rendered to JPEG by scripts/build-og.mjs.

  It deliberately does NOT load the site's stylesheets. A share card is a fixed
  1200x630 raster with no reader, no theme, and no viewport, so the cascade that
  serves the site would be answering questions this file does not have. The few
  token values it needs are copied in literally.

  The art is the brand kit's hero_dark render (2400x1500), passed in as `art`: a
  transparent 3/4 view lit and bloomed for the site's own ink ground, so the card
  is that ground and graticule with the monogram on the left and the words on
  the right.

  This layout mirrors the kit's own social card
  (cm-universe/source/pipeline/cm5_compose/kit.html, LAYOUT.social) down to the
  type sizes and colours, so a link preview of the site and the kit's og-image
  are one design. What this file adds is the per-page eyebrow, title and
  subtitle, which the kit's fixed card has no need of.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Graph card</title>
<style>
  :root {
    --ink-950: #02090e;
    --green-300: #b9e87f;
    --ink-100: #d6dade;
    --ink-300: #9aa0a6;
    --paper-050: #ffffff;
    --font-display: ui-serif, Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    /* Where the words start. The M's right edge sits at about 92% of the art. */
    --column: 700px;
    --edge: 64px;
    --art-width: 672px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: var(--ink-950);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  /* The hero's 64px graticule, at its dark-theme strength, fading out before
     it reaches the words. */
  .grid {
    position: absolute;
    inset: 0;
    opacity: 0.09;
    background:
      repeating-linear-gradient(0deg, var(--ink-100) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(90deg, var(--ink-100) 0 1px, transparent 1px 64px);
    -webkit-mask-image: linear-gradient(90deg, #000 30%, transparent 62%);
    mask-image: linear-gradient(90deg, #000 30%, transparent 62%);
  }
  .art {
    position: absolute;
    top: 50%;
    left: 16px;
    width: var(--art-width);
    height: auto;
    transform: translateY(-50%);
  }
  .column {
    position: absolute;
    inset-block: 52px;
    inset-inline: var(--column) var(--edge);
    display: flex;
    flex-direction: column;
  }
  .wordmark { display: flex; flex-direction: column; gap: 4px; }
  /* The site header's wordmark, at the kit's card size: a semibold tracked first
     line over a lighter, wider-tracked dim second. The negative end margin claws
     back the trailing gap the last letter's tracking leaves behind, as the
     header does. */
  .wordmark__line {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.08em;
    line-height: 1.18;
    color: var(--paper-050);
  }
  .wordmark__line--wide {
    font-weight: 400;
    letter-spacing: 0.22em;
    margin-inline-end: -0.22em;
    color: var(--ink-300);
  }
  .stack { margin-block: auto; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--green-300);
    /* The site's emissive accent, which on the ink ground is a faint halo. */
    text-shadow: 0 0 12px rgb(185 232 127 / 0.35);
  }
  .title {
    margin-block-start: 22px;
    font-family: var(--font-display);
    font-weight: 700;
    line-height: 1.04;
    letter-spacing: -0.015em;
    color: var(--paper-050);
    /* Stepped down below if the name would run past two lines. */
    font-size: 68px;
  }
  .subtitle {
    margin-block-start: 22px;
    font-family: var(--font-display);
    font-style: italic;
    line-height: 1.35;
    color: var(--paper-050);
    /* Stepped down below until the widest caller-supplied line fits. */
    font-size: 25px;
    white-space: nowrap;
  }
  .domain {
    font-family: var(--font-mono);
    font-size: 15px;
    letter-spacing: 0.22em;
    color: var(--ink-300);
  }
</style>
</head>
<body>
<div class="grid"></div>
<img class="art" id="art" alt="">

<div class="column">
  <div class="wordmark">
    <span class="wordmark__line">CURIOSITY</span>
    <span class="wordmark__line wordmark__line--wide">MAPPED</span>
  </div>

  <div class="stack">
    <p class="eyebrow" id="eyebrow"></p>
    <p class="title" id="title"></p>
    <p class="subtitle" id="subtitle"></p>
  </div>

  <p class="domain">curiositymapped.com</p>
</div>

<script>
  /*
   * Content comes from the query string so the template is one file rather than
   * seven near-copies. Written with textContent: this page is rendered locally and
   * never served, but a template that builds markup from a URL is a habit worth
   * not having.
   */
  var q = new URLSearchParams(location.search);
  document.getElementById('eyebrow').textContent = q.get('eyebrow') || '';
  document.getElementById('title').textContent = q.get('title') || 'Curiosity Mapped';

  /* The subtitle breaks where the caller says, so it balances rather than
     wrapping wherever the column happens to end. */
  var subtitle = document.getElementById('subtitle');
  (q.get('subtitle') || '').split('|').forEach(function (line, i) {
    if (i) subtitle.appendChild(document.createElement('br'));
    subtitle.appendChild(document.createTextNode(line));
  });

  function fit() {
    /*
     * Long titles step down until they fit in two lines. Measured by height:
     * the title is a block that wraps, so its scrollWidth is its container's
     * width however long the text is, and a width test would never fire.
     */
    var title = document.getElementById('title');
    var size = 68;
    while (size > 40 && title.getBoundingClientRect().height > size * 1.04 * 2 + 4) {
      size -= 2;
      title.style.fontSize = size + 'px';
    }
    /* The subtitle does not wrap, so here width is the right test. */
    var sub = 25;
    while (sub > 16 && subtitle.scrollWidth > subtitle.clientWidth) {
      sub -= 1;
      subtitle.style.fontSize = sub + 'px';
    }
  }

  var art = document.getElementById('art');
  art.src = q.get('art') || '';
  Promise.all([art.decode(), document.fonts.ready])
    .then(fit)
    .then(function () { document.documentElement.dataset.ready = '1'; });
</script>
</body>
</html>
