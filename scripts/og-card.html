<!DOCTYPE html>
<!--
  The Open Graph card template. One file, parameterised through the query string,
  rendered to JPEG by scripts/build-og.mjs.

  It deliberately does NOT load the site's stylesheets. A share card is a fixed
  1200x630 raster with no reader, no theme, and no viewport, so the cascade that
  serves the site would be answering questions this file does not have. The few
  token values it needs are copied in literally.

  The ground is the brand kit's og_reference_dark render (2400x1260, exactly 2x
  the card), passed in as `ground`. The monogram occupies its left half, so the
  words take the right half, over a scrim: the render's right side is lit by a
  pale sweep of light that white type would otherwise sit on.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Graph card</title>
<style>
  :root {
    --ink-950: #02090e;
    --green-300: #b9e87f;
    --ink-100: #d6dade;
    --ink-300: #9aa0a6;
    --paper-050: #ffffff;
    --font-display: ui-serif, Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    /* Where the words start. The M's right edge sits at about 54% of the render. */
    --column: 700px;
    --edge: 64px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: var(--ink-950);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  .ground {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* Clear over the monogram, then deepening to ink across the text column. */
  .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
      rgb(2 9 14 / 0) 50%,
      rgb(2 9 14 / 0.86) 60%,
      rgb(2 9 14 / 0.92) 100%);
  }
  .column {
    position: absolute;
    inset-block: 52px;
    inset-inline: var(--column) var(--edge);
    display: flex;
    flex-direction: column;
  }
  .wordmark { display: flex; flex-direction: column; gap: 4px; }
  .wordmark__line {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.13em;
    line-height: 1;
    color: var(--paper-050);
  }
  .wordmark__line--wide {
    font-weight: 400;
    letter-spacing: 0.30em;
    color: var(--ink-300);
  }
  .stack { margin-block: auto; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--green-300);
  }
  .title {
    margin-block-start: 22px;
    font-family: var(--font-display);
    font-weight: 700;
    line-height: 1.04;
    letter-spacing: -0.015em;
    color: var(--paper-050);
    /* Stepped down below if the name would run past two lines. */
    font-size: 68px;
  }
  .subtitle {
    margin-block-start: 22px;
    font-family: var(--font-display);
    font-style: italic;
    line-height: 1.4;
    color: var(--ink-100);
    /* Stepped down below until the widest caller-supplied line fits. */
    font-size: 25px;
    white-space: nowrap;
  }
  .domain {
    font-family: var(--font-mono);
    font-size: 15px;
    letter-spacing: 0.22em;
    color: var(--ink-300);
  }
</style>
</head>
<body>
<img class="ground" id="ground" alt="">
<div class="scrim"></div>

<div class="column">
  <div class="wordmark">
    <span class="wordmark__line">CURIOSITY</span>
    <span class="wordmark__line wordmark__line--wide">MAPPED</span>
  </div>

  <div class="stack">
    <p class="eyebrow" id="eyebrow"></p>
    <p class="title" id="title"></p>
    <p class="subtitle" id="subtitle"></p>
  </div>

  <p class="domain">curiositymapped.com</p>
</div>

<script>
  /*
   * Content comes from the query string so the template is one file rather than
   * seven near-copies. Written with textContent: this page is rendered locally and
   * never served, but a template that builds markup from a URL is a habit worth
   * not having.
   */
  var q = new URLSearchParams(location.search);
  document.getElementById('eyebrow').textContent = q.get('eyebrow') || '';
  document.getElementById('title').textContent = q.get('title') || 'Curiosity Mapped';

  /* The subtitle breaks where the caller says, so it balances rather than
     wrapping wherever the column happens to end. */
  var subtitle = document.getElementById('subtitle');
  (q.get('subtitle') || '').split('|').forEach(function (line, i) {
    if (i) subtitle.appendChild(document.createElement('br'));
    subtitle.appendChild(document.createTextNode(line));
  });

  function fit() {
    /*
     * Long titles step down until they fit in two lines. Measured by height:
     * the title is a block that wraps, so its scrollWidth is its container's
     * width however long the text is, and a width test would never fire.
     */
    var title = document.getElementById('title');
    var size = 68;
    while (size > 40 && title.getBoundingClientRect().height > size * 1.04 * 2 + 4) {
      size -= 2;
      title.style.fontSize = size + 'px';
    }
    /* The subtitle does not wrap, so here width is the right test. */
    var sub = 25;
    while (sub > 16 && subtitle.scrollWidth > subtitle.clientWidth) {
      sub -= 1;
      subtitle.style.fontSize = sub + 'px';
    }
  }

  var ground = document.getElementById('ground');
  ground.src = q.get('ground') || '';
  Promise.all([ground.decode(), document.fonts.ready])
    .then(fit)
    .then(function () { document.documentElement.dataset.ready = '1'; });
</script>
</body>
</html>
